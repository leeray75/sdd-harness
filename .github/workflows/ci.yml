name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pushes to main always finish; a newer pull request run cancels the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Enable Corepack (provides the pinned pnpm)
        run: corepack enable

      - name: Set up Node from .nvmrc, with the pnpm store cache
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

  e2e:
    name: e2e and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Enable Corepack (provides the pinned pnpm)
        run: corepack enable

      - name: Set up Node from .nvmrc, with the pnpm store cache
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Allow unprivileged user namespaces for Electron (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install fluxbox window manager and xprop (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fluxbox x11-utils

      - name: E2E tests (Linux, under a virtual display with a window manager)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a bash -c '
            fluxbox >/dev/null 2>&1 &
            wm_ready=0
            for _ in $(seq 1 20); do
              if xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q "window id #"; then
                wm_ready=1
                break
              fi
              sleep 0.5
            done
            if [ "$wm_ready" != "1" ]; then
              echo "fluxbox did not start within about 10 s (no _NET_SUPPORTING_WM_CHECK on the root window); not running the tests without a window manager" >&2
              exit 1
            fi
            pnpm e2e
          '

      - name: E2E tests
        if: runner.os != 'Linux'
        run: pnpm e2e

      - name: Package, unsigned, reusing the out/ build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --dir

      - name: Upload Playwright failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
